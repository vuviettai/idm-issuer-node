server {
    server_name  issuer.idm.smartform.click;
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/issuer.idm.smartform.click/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/issuer.idm.smartform.click/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    location /api/ {   
        proxy_pass http://localhost:3001/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/cors.inc;
   }
   location / {   
        proxy_pass http://localhost:8088/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/cors.inc;
   }
}

server {
    if ($host = issuer.idm.smartform.click) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name  issuer.idm.smartform.click;
    listen       80;
    return 404; # managed by Certbot
}